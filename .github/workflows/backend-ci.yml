name: Spring Boot Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code from GitHub
        uses: actions/checkout@v3

      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Verify Build & Compile with Maven
        run: mvn clean package -DskipTests